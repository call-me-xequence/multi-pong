# nginx.conf — serves the static frontend and proxies API + WebSocket to the Go backend.
# The backend is reachable as the docker-compose service `backend` on port 8080.

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # WebSocket endpoint — must pass Upgrade headers and keep the
        # connection open for long periods.
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # REST API
        location /create-room {
            proxy_pass http://backend;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /rooms {
            proxy_pass http://backend;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /healthz {
            proxy_pass http://backend;
        }

        # Static SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
