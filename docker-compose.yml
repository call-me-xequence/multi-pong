services:
  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PORT: "8080"

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
